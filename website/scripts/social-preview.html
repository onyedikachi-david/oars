<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Oars social image artwork</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { font-family: "Avenir Next", Arial, sans-serif; color: #17212c; background: #fff; }
    .scene { position: relative; width: 1200px; height: 630px; overflow: hidden; }
    .blue-field { position: absolute; inset: 0 0 0 365px; background: #edf2f8; }
    .brand { position: absolute; left: 42px; top: 64px; display: flex; align-items: center; gap: 11px; font-size: 33px; line-height: 44px; font-weight: 600; letter-spacing: -1px; color: #2264c6; }
    .brand img { width: 42px; height: 42px; border-radius: 10px; }
    h1 { position: absolute; left: 42px; top: 230px; width: 290px; margin: 0; font-size: 46px; line-height: 1.13; font-weight: 500; letter-spacing: -2px; }
    .product { position: absolute; left: 397px; top: 75px; width: 768px; height: 480px; border-radius: 9px; overflow: hidden; outline: 1px solid #00000015; box-shadow: 0 12px 28px #23394f20, 0 2px 6px #23394f0d; }
    .product img { display: block; width: 768px; height: 480px; }
    .domain { position: absolute; left: 42px; bottom: 64px; color: #2264c6; font-size: 17px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="scene">
    <div class="blue-field"></div>
    <div class="brand"><img src="/brand/oars-symbol.svg" alt="">Oars</div>
    <h1>Your servers.<br>One calm<br>workspace.</h1>
    <div class="product"><img src="/screenshots/fleet-workspace.png" alt="Oars workspace showing all four terminal panes and 15 connected demo servers"></div>
    <div class="domain">getoars.app</div>
  </div>
</body>
</html>
