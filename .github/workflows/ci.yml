name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"
  NATIVE_SDK_VERSION: "0.7.1"

jobs:
  test:
    name: Logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify release version consistency
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < version.txt)"
          grep -F ".version = \"$VERSION\"" app.zon
          grep -F "const app_version = \"$VERSION\"" build.zig
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install Native SDK
        run: npm install --global @native-sdk/cli@${{ env.NATIVE_SDK_VERSION }}
      - name: Resolve Native SDK path
        id: native-sdk
        shell: bash
        run: |
          echo "path=$(npm root --global)/@native-sdk/cli" >> "$GITHUB_OUTPUT"
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Check frontend types
        run: npm --prefix frontend run typecheck
      - name: Test frontend user paths
        run: npm --prefix frontend test
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Run Zig tests
        run: zig build test -Dplatform=null -Dnative-sdk-path="${{ steps.native-sdk.outputs.path }}"
      - name: Test disposable SSH and MinIO workflows
        timeout-minutes: 20
        run: scripts/integration-test.sh -Dplatform=null -Dnative-sdk-path="${{ steps.native-sdk.outputs.path }}"

  release-please:
    name: Prepare release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Update release PR or create release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-state:
    name: Resolve release state
    if: always() && needs.test.result == 'success' && needs.release-please.result != 'cancelled'
    needs:
      - test
      - release-please
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.state.outputs.is_release }}
      tag_name: ${{ steps.state.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve current release tag
        id: state
        env:
          RELEASE_PLEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          TAG="$RELEASE_PLEASE_TAG"
          if [ -z "$TAG" ]; then
            TAG="$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | sed -n '1p')"
          fi
          if [ -n "$TAG" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "tag_name=" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            target: macos
            arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            target: macos
            arch: x86_64
          - name: Linux x86_64
            os: ubuntu-24.04
            target: linux
            arch: x86_64
    uses: ./.github/workflows/package.yml
    with:
      runner: ${{ matrix.os }}
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      source-ref: ${{ github.sha }}

  publish-release:
    name: Attach release packages
    if: needs.release-state.outputs.is_release == 'true'
    needs:
      - release-state
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: oars-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          (cd release-assets && sha256sum *) > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" release-assets/SHA256SUMS
      - name: Upload packages to the generated release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-state.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "${{ github.repository }}"
