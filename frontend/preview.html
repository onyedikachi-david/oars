<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oars UI preview</title>
    <script>
	      (() => {
        const now = Date.now();
        const monitorMode = new URLSearchParams(window.location.search).get("monitor") || "healthy";
        const logsMode = new URLSearchParams(window.location.search).get("logs") || "default";
        const vncProbeMode = new URLSearchParams(window.location.search).get("vncProbe") || "ready";
        const vncSetupMode = new URLSearchParams(window.location.search).get("vncSetup") || "install";
        const vncPollMode = new URLSearchParams(window.location.search).get("vncPoll") || "listening";
        const vncCredsMode = new URLSearchParams(window.location.search).get("vncCreds") || "none";
        const vncTunnelMode = new URLSearchParams(window.location.search).get("vncTunnel") || "ok";
        let nextDiagnosticChannel = 900;
        // Logs fixtures (spec 04): deterministic sources, lines with
        // repeatable search matches, one very long line, a follow channel
        // state machine, stale-then-fresh clear, and SFTP transfer
        // progress. Every call is recorded in `calls` for payload checks.
        const LOG_BASE = Math.floor(Date.now() / 1000) - 3600;
        const utf8Encoder = new TextEncoder();
        const utf8Decoder = new TextDecoder();
        const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        const utf8Length = (value) => utf8Encoder.encode(value).length;
        const utf8Slice = (value, from) => utf8Decoder.decode(utf8Encoder.encode(value).slice(from));
        function buildLogLines(count) {
          const lines = [];
          for (let i = 0; i < count; i++) {
            const t = new Date((LOG_BASE - count + i) * 1000).toISOString().replace("T", " ").slice(0, 19);
            if (i === 42) {
              lines.push(t + " WARN " + "x".repeat(100000) + " END");
            } else if (i % 7 === 3) {
              lines.push(t + " ERROR checkout-error on order " + i + " retrying in 1s");
            } else {
              lines.push(t + " INFO request " + i + " handled in " + (i % 40) + "ms");
            }
          }
          return lines;
        }
        const LOG_SOURCES = [
          { path: "/var/log/nginx/access.log", group: "web", name: "Nginx · access", size: 472000, mtime_epoch: LOG_BASE + 15, age_sec: 45, mode: 420, readable: true },
          { path: "/var/log/nginx/error.log", group: "web", name: "Nginx · error", size: 128000, mtime_epoch: LOG_BASE - 840, age_sec: 900, mode: 420, readable: true },
          { path: "/var/log/apache2/access.log", group: "web", name: "Apache · access", size: 3100000, mtime_epoch: LOG_BASE - 60, age_sec: 120, mode: 420, readable: true },
          { path: "/var/log/pm2/app-out.log", group: "runtime", name: "PM2 · app out", size: 86000, mtime_epoch: LOG_BASE + 48, age_sec: 12, mode: 420, readable: true },
          { path: "/var/log/pm2/app-error.log", group: "runtime", name: "PM2 · app error", size: 2048, mtime_epoch: LOG_BASE - 240, age_sec: 300, mode: 420, readable: true },
          { path: "/var/log/node/api-stdout.log", group: "runtime", name: "Node · api stdout", size: 500, mtime_epoch: LOG_BASE - 17640, age_sec: 18000, mode: 420, readable: true },
          { path: "/var/log/syslog", group: "system", name: "syslog", size: 91000000, mtime_epoch: LOG_BASE + 30, age_sec: 30, mode: 384, readable: false },
          { path: "/var/log/auth.log", group: "system", name: "auth.log", size: 1200000, mtime_epoch: LOG_BASE + 2, age_sec: 58, mode: 384, readable: false },
          { path: "/var/log/kern.log", group: "system", name: "kern.log", size: 780000, mtime_epoch: LOG_BASE - 540, age_sec: 600, mode: 420, readable: true },
          { path: "/opt/app/logs/custom-app.log", group: "custom", name: "custom-app.log", size: 999, mtime_epoch: LOG_BASE - 18000, age_sec: 20000, mode: 420, readable: true },
        ];
        const logScanState = { sizes: new Map() };
        function logSources() {
          return LOG_SOURCES.map((s) => ({ ...s, size: logScanState.sizes.get(s.path) ?? s.size }));
        }
        const followState = { channel: 44, emitted: "", polls: 0, closed: false, droppedAt: 5, eofAt: 12 };
        const clearAttempts = new Map();
        const dlTransfers = new Map();
        let dlNextId = 3001;
        // ── VNC fixtures (spec 12): deterministic probe, start, poll, stop, setup, credentials, disconnected states
        let vncNextTunnelId = 2001;
        let vncNextPort = 48181;
        let vncConfigured = false;
        const vncTunnels = new Map(); // tunnel_id -> { port, token, state, bytes_up, bytes_down, error }
        function vncProbePayload() {
          if (vncConfigured) return { ok: true, x11vnc: true, tigervnc: false, listening: [{ port: 5900, process: "x11vnc" }] };
          if (vncProbeMode === "missing") return { ok: true, x11vnc: false, tigervnc: false, listening: [] };
          if (vncProbeMode === "partial") return { ok: true, x11vnc: true, tigervnc: false, listening: [{ port: 5901, process: "Xvnc" }] };
          // ready: x11vnc installed + one listener
          return { ok: true, x11vnc: true, tigervnc: true, listening: [{ port: 5901, process: "x11vnc" }] };
        }
        function vncSetupHint(display) {
          const port = 5900 + display;
          return "x11vnc -storepasswd $HOME/.local/share/oars/vnc/display-" + display + ".passwd; x11vnc -display :" + display + " -rfbport " + port + " -localhost -forever -shared -rfbauth $HOME/.local/share/oars/vnc/display-" + display + ".passwd";
        }
        function vncSetupPayload(display, dryRun, password) {
          const d = display ?? 0;
          const action = vncSetupMode === "already" || vncConfigured ? "configure" : "install";
          if (vncSetupMode === "already" && dryRun) return { ok: true, action, plan: "", hint: vncSetupHint(d), executed: false };
          if (vncSetupMode === "manual") return { ok: true, action: "manual", plan: "", hint: "install x11vnc for your distribution, then start it bound to 127.0.0.1 with a password", executed: false };
          if (vncSetupMode === "fail") {
            // dry_run preview still returns a plan; installed path would error — emulate as ok:false rejected by handler
            if (dryRun) return { ok: true, action: "install", plan: "apt-get update && apt-get install -y x11vnc xvfb", hint: vncSetupHint(d), executed: false };
            return { ok: false, error: "VNC configuration failed" };
          }
          if (dryRun) return { ok: true, action, plan: action === "install" ? "apt-get update && apt-get install -y x11vnc xvfb" : "", hint: vncSetupHint(d), executed: false };
          if (!password) return { ok: false, error: "enter a VNC password" };
          vncConfigured = true;
          return { ok: true, action, plan: action === "install" ? "apt-get update && apt-get install -y x11vnc xvfb" : "", hint: vncSetupHint(d), executed: true };
        }

        const servers = [
          {
            id: "prod-api",
            name: "Production API",
            host: "api.internal.example",
            port: 22,
            user: "deploy",
            auth_method: "password",
            key_path: "",
            key_has_passphrase: false,
            host_fingerprint: "SHA256:uYNQ7k9gM4xqM+0B8QHxA5z6wEHlDCq3lKl7T0P9f+E",
            group: "Production/Core",
            tags: ["api", "critical"],
            via_server_id: null,
            created_at: now - 100000,
            updated_at: now,
          },
          {
            id: "staging-web",
            name: "Staging Web",
            host: "10.24.8.17",
            port: 2222,
            user: "ubuntu",
            auth_method: "key",
            key_path: "~/.ssh/id_ed25519",
            key_has_passphrase: false,
            host_fingerprint: null,
            group: "Staging",
            tags: ["web"],
            via_server_id: null,
            created_at: now - 80000,
            updated_at: now,
          },
          {
            id: "changed-host",
            name: "Legacy Database",
            host: "db-01.internal.example",
            port: 22,
            user: "dba",
            auth_method: "agent",
            key_path: "",
            key_has_passphrase: false,
            host_fingerprint: "SHA256:OLDKEY",
            group: "Production/Data",
            tags: ["database"],
            via_server_id: null,
            created_at: now - 60000,
            updated_at: now,
          },
        ];
        const calls = [];
        const polls = new Map();
        const previewSecrets = new Map();
        function recordCall(command, payload) {
          let recorded = payload;
          if (command === "native-sdk.credentials.set" && payload && "secret" in payload) recorded = { ...payload, secret: "<redacted>" };
          if (command === "oars.vnc.setup" && payload && "password" in payload) recorded = { ...payload, password: "<redacted>" };
          calls.push({ command, payload: recorded, at: performance.now() });
          document.documentElement.dataset.oarsCalls = JSON.stringify(calls);
        }
        window.__oarsMock = { calls, servers };
        window.zero = {
          async invoke(command, payload = {}) {
            recordCall(command, payload);
            if (command === "oars.servers.list") return { servers };
            if (command === "oars.servers.save") {
              const current = servers.find((server) => server.id === payload.id);
              const saved = { ...(current || servers[0]), ...payload, id: payload.id || "new-profile", updated_at: Date.now() };
              if (current) Object.assign(current, saved); else servers.push(saved);
              return { server: saved };
            }
            if (command === "oars.servers.delete") return { ok: true };
            if (command.startsWith("native-sdk.credentials.")) {
              if (command.endsWith(".set")) { previewSecrets.set(payload.account, payload.secret); return { ok: true }; }
              if (command.endsWith(".delete")) { previewSecrets.delete(payload.account); return { ok: true }; }
              if (command.endsWith(".get")) {
                if (previewSecrets.has(payload.account)) return previewSecrets.get(payload.account);
                if (vncCredsMode === "none" && payload.account && String(payload.account).startsWith("vnc:")) return null;
                return "preview-secret";
              }
              return { ok: true };
            }
            if (command === "oars.ssh.connect" || command === "oars.ssh.disconnect" || command === "oars.ssh.resize" || command === "oars.ssh.input" || command === "oars.ssh.trust") return { ok: true };
            if (command === "oars.ssh.retrust") {
              const server = servers.find((item) => item.id === payload.server_id);
              server.host_fingerprint = null;
              return { server };
            }
            if (command === "oars.ssh.poll") {
              const count = (polls.get(payload.server_id) || 0) + 1;
              polls.set(payload.server_id, count);
              if (payload.server_id === "staging-web") {
                return { ok: true, status: "needs_trust", trust: { pending: true, algorithm: "Ed25519", fingerprint: "SHA256:zxM8slJ7bI2bSWWi0i7o8eHIKnTe0iT5Qq6Vt8jz6LQ" }, channels: [] };
              }
              if (payload.server_id === "changed-host") {
                return { ok: true, status: "error", error: "host key changed (old: SHA256:OLDKEY, new: SHA256:NEWKEY); connection blocked", channels: [] };
              }
              if (count < 20) return { ok: true, status: "connecting", channels: [] };
              return {
                ok: true,
                status: "ready",
                channels: [
                  { id: 0, kind: "shell", command: "", cursor: 73, dropped: 0, pending: 0, eof: false, exit: null, data: count === 20 ? "Last login: Fri Aug 7 12:58:04\r\ndeploy@prod-api:~$ " : "" },
                  { id: 8, kind: "exec", command: "uptime", cursor: 22, dropped: 0, pending: 0, eof: true, exit: 0, data: "EXEC_MUST_NOT_RENDER" },
                ],
              };
            }
            if (command === "oars.monitor.poll") {
              const c = (polls.get(payload.server_id + ":mon") || 0) + 1;
              polls.set(payload.server_id + ":mon", c);
              if (monitorMode === "not-ready") return { ok: true, status: "not_ready" };
              if (monitorMode === "sampling") {
                return { ok: true, ts: 0, cpu: null, mem: null, disk: null, processes: [], probe_error: "no sample yet" };
              }
              if (payload.server_id === "changed-host") {
                return { ok: true, ts: 0, cpu: null, mem: null, disk: null, processes: [], probe_error: "no /proc readable (loadavg empty)" };
              }
              const warming = c < 2;
              const degraded = monitorMode === "degraded";
              const cpuPct = warming ? null : degraded ? 92.4 : 24 + Math.sin(c / 5) * 8;
              return {
                ok: true,
                ts: Date.now() * 1000000,
                cpu: { utilization_pct: cpuPct, cpu_warming: warming, load_1: 0.42, load_5: 0.31, load_15: 0.22, uptime_sec: 86400*3 + 3600*5, cores: 4 },
                mem: degraded
                  ? { used_bytes: 7.1*1024**3, total_bytes: 7.8*1024**3, available_bytes: 0.7*1024**3, swap_used_bytes: 1.4*1024**3, swap_total_bytes: 2*1024**3 }
                  : { used_bytes: 4.2*1024**3, total_bytes: 7.8*1024**3, available_bytes: 3.1*1024**3, swap_used_bytes: 0.2*1024**3, swap_total_bytes: 2*1024**3 },
                disk: degraded
                  ? { used_bytes: 25.7*1024**3, total_bytes: 29*1024**3, available_bytes: 3.3*1024**3 }
                  : { used_bytes: 15*1024**3, total_bytes: 29*1024**3, available_bytes: 14*1024**3 },
                processes: [
                  { pid: 1842, name: "node", cpu: 4.2, mem: 3.1 },
                  { pid: 912, name: "postgres", cpu: 2.8, mem: 5.4 },
                  { pid: 441, name: "nginx", cpu: 0.6, mem: 0.8 },
                  { pid: 2011, name: "oars", cpu: cpuPct ?? 0.2, mem: 1.2 },
                ],
                probe_error: degraded ? "Process details are incomplete because one /proc entry could not be read." : null,
              };
            }
            if (command === "oars.monitor.probe") {
              polls.set(payload.server_id + ":mon", (polls.get(payload.server_id + ":mon")||0)+1);
              return { ok: true };
            }
            if (command === "oars.monitor.cleanDiskEstimate" || command === "oars.monitor.cleanDisk" || command === "oars.monitor.dropCaches") {
              const ch = nextDiagnosticChannel++;
              if (!window.__oarsMock.diagChannels) window.__oarsMock.diagChannels = new Map();
              const label = command.includes("cleanDiskEstimate")
                ? payload.plan === "journal"
                  ? "Archived and active journals take up 1.2G in the file system.\n"
                  : "356515840 /var/cache/apt\n"
                : command.includes("cleanDisk")
                  ? payload.plan === "journal"
                    ? "Vacuuming done, freed 1.1G of archived journals.\n"
                    : "APT package cache cleaned.\n"
                  : "sync complete; wrote drop_caches level "+payload.level+".\n";
              window.__oarsMock.diagChannels.set(ch, { label, done: false });
              return { ok: true, channel: ch };
            }
            // ── Logs (spec 04) fixtures ──────────────────────────────
            if (command === "oars.logs.scan") {
              if (logsMode === "empty") return { ok: true, sources: [], partial: false, reason: "" };
              const srcs = logSources();
              if (logsMode === "partial") {
                return { ok: true, sources: srcs, partial: true, reason: "entry limit reached at 500 files; some paths were not scanned" };
              }
              return { ok: true, sources: srcs, partial: false, reason: "" };
            }
            if (command === "oars.logs.read") {
              if (logsMode === "stale-read" && payload.path === "/var/log/nginx/access.log") await delay(500);
              const binary = logsMode === "binary" && payload.path === "/var/log/nginx/access.log";
              const lines = binary ? [] : buildLogLines(payload.lines);
              if (lines.length > 0) lines[0] = `${lines[0]} SOURCE=${payload.path}`;
              return {
                ok: true,
                path: payload.path,
                lines,
                limited: logsMode === "limited" || payload.lines === 5000,
                binary,
              };
            }
            if (command === "oars.logs.follow") {
              if (logsMode === "stale-follow") await delay(500);
              followState.channel = 44;
              followState.emitted = buildLogLines(100).join("\n") + "\n2026-08-07T10:00:59Z INFO café worker ready 🚀\n";
              followState.polls = 0;
              followState.closed = false;
              return { ok: true, channel: 44 };
            }
            if (command === "oars.logs.clear") {
              const n = clearAttempts.get(payload.path) || 0;
              clearAttempts.set(payload.path, n + 1);
              if (n === 0) {
                logScanState.sizes.set(payload.path, 512000);
                return { ok: false, error: "file changed since preview; re-scan before clearing" };
              }
              logScanState.sizes.set(payload.path, 0);
              return { ok: true, before_size: payload.expected.size, after_size: 0 };
            }
            if (command === "oars.logs.addSource") {
              LOG_SOURCES.push({
                path: payload.path,
                group: "custom",
                name: payload.path.split("/").pop(),
                size: 1024,
                mtime_epoch: LOG_BASE - 60,
                age_sec: 60,
                mode: 420,
                readable: true,
              });
              logScanState.sizes.clear();
              return { ok: true };
            }
            if (command === "oars.sftp.download") {
              const id = dlNextId++;
              dlTransfers.set(id, { id, kind: "download", path: payload.remote_path.utf8, bytes: 0, total: 472000, status: "running", error: "" });
              return { ok: true, op_id: id };
            }
            if (command === "oars.sftp.poll") {
              for (const t of dlTransfers.values()) {
                if (t.status !== "running") continue;
                if (logsMode === "dlfail") { t.status = "failed"; t.error = "permission denied"; continue; }
                t.bytes = Math.min(t.total, t.bytes + 110000);
                if (t.bytes >= t.total) t.status = "done";
              }
              return { ok: true, transfers: [...dlTransfers.values()] };
            }
            if (command === "oars.sftp.cancel") {
              const t = dlTransfers.get(payload.transfer_id);
              if (t && t.status === "running") t.status = "canceled";
              return { ok: true };
            }
            // ── VNC fixtures (spec 12) ────────────────────────────────
            if (command === "oars.vnc.probe") {
              if (vncProbeMode === "error") return { ok: false, error: "probe failed" };
              return vncProbePayload();
            }
            if (command === "oars.vnc.setup") {
              const result = vncSetupPayload(payload.display ?? 0, !!payload.dry_run, payload.password);
              if (result.ok === false) return result;
              return result;
            }
            if (command === "oars.vnc.start") {
              if (vncTunnelMode === "fail") return { ok: false, error: "tunnel start failed" };
              if (vncTunnelMode === "timeout") { await delay(2500); return { ok: false, error: "tunnel start timed out" }; }
              if (vncTunnelMode === "slow") { await delay(30000); return { ok: false, error: "tunnel start timed out" }; }
              const tid = vncNextTunnelId++;
              const port = vncNextPort++;
              const token = Array.from({length:32}, () => Math.floor(Math.random()*16).toString(16)).join("");
              vncTunnels.set(tid, { port, token, state: vncPollMode, bytes_up: 0, bytes_down: 0, error: vncTunnelMode === "closed" ? "no VNC server on 127.0.0.1:" + (payload.port ?? 5900) + " — try the setup helper" : "" });
              // simulate byte growth on subsequent polls
              return { ok: true, tunnel_id: tid, ws_port: port, token };
            }
            if (command === "oars.vnc.poll") {
              const entry = vncTunnels.get(payload.tunnel_id);
              if (!entry) return { ok: false, error: "unknown tunnel" };
              // advance bytes on each poll call to exercise the footer counter
              entry.bytes_up += 2048;
              entry.bytes_down += entry.state === "connected" ? 8192 : 0;
              // honor ?vncPoll=connected / listening / closed / error
              if (vncPollMode === "closed") entry.state = "closed";
              if (vncPollMode === "error") { entry.state = "closed"; entry.error = "channel open failed"; }
              return { ok: true, state: entry.state, bytes_up: entry.bytes_up, bytes_down: entry.bytes_down, error: entry.error };
            }
            if (command === "oars.vnc.stop") {
              const entry = vncTunnels.get(payload.tunnel_id);
              if (entry) entry.state = "closed";
              return { ok: true };
            }
            if (command === "native-sdk.dialog.saveFile") {
              if (logsMode === "nodialog") return null;
              return "/Users/preview/Downloads/" + (payload.defaultName || "download.log");
            }
            if (command === "oars.ssh.closeChannel") {
              if (payload.channel === followState.channel) followState.closed = true;
              return { ok: true };
            }
            return { ok: true };
          },
        };
        // Wrap ssh.poll to stream diag + follow channel output
        (() => {
          const origInvoke = window.zero.invoke.bind(window.zero);
          window.zero.invoke = async (command, payload={}) => {
            if (command === "oars.ssh.poll") {
              const cur = payload.cursors && payload.cursors[0];
              const chId = cur ? cur.channel : null;
              // Follow channel (spec 04): absolute cursor protocol — the
              // response carries the delta from the requested cursor.
              if (chId === followState.channel && !followState.closed) {
                recordCall(command, payload);
                if (logsMode === "follow-error") {
                  return { ok: false, error: "simulated follow poll failure" };
                }
                followState.polls += 1;
                const p = followState.polls;
                if (p === 3) {
                  followState.emitted += "2026-08-07T10:01:00Z INFO follow chunk A\n2026-08-07T10:01:01Z INFO request 101 handled in 12ms\n2026-08-07T10:01:02Z INFO follow chunk A end\n";
                }
                if (p === 5) {
                  followState.emitted += "tail: '/var/log/nginx/access.log' has been replaced; following new file\n2026-08-07T10:01:30Z INFO rotation chunk B line 1\n2026-08-07T10:01:31Z INFO rotation chunk B line 2\n";
                }
                if (p === 8) {
                  followState.emitted += "2026-08-07T10:02:00Z ERROR checkout-error on order 777\n2026-08-07T10:02:01Z INFO retry in 1s\n";
                }
                const eof = p >= followState.eofAt;
                const from = cur ? cur.cursor : 0;
                const cursor = utf8Length(followState.emitted);
                return {
                  ok: true,
                  status: "ready",
                  channels: [{
                    id: followState.channel,
                    kind: "log",
                    command: "tail -n 100 -F /var/log/nginx/access.log",
                    cursor,
                    dropped: p === followState.droppedAt ? 4096 : 0,
                    pending: 0,
                    eof,
                    exit: null,
                    data: utf8Slice(followState.emitted, from),
                  }],
                };
              }
              if (chId !== null && window.__oarsMock.diagChannels && window.__oarsMock.diagChannels.has(chId)) {
                const entry = window.__oarsMock.diagChannels.get(chId);
                if (!entry.done) {
                  entry.done = true;
                  return { ok: true, status: "ready", channels: [{ id: chId, kind: "exec", command: "diag", cursor: entry.label.length, dropped: 0, pending: 0, eof: true, exit: 0, data: entry.label }] };
                }
                return { ok: true, status: "ready", channels: [{ id: chId, kind: "exec", command: "diag", cursor: entry.label.length, dropped: 0, pending: 0, eof: true, exit: 0, data: "" }] };
              }
            }
            return origInvoke(command, payload);
          };
        })();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
