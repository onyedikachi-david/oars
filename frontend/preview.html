              if (filesMode === "unreadable" && p === "/var") return { ok: false, error: "permission denied (13) — the account cannot read this folder" };
              const entries = FSTREE[p];
              if (entries === undefined) return { ok: false, error: "no such directory: " + p };
              if (filesMode === "truncated" && p === "/") return { ok: true, entries: entries.slice(0, 3), truncated: true };
              return { ok: true, entries, truncated: false };
            }
            if (command === "oars.sftp.stat") {
              const found = fsResolve(pathKey(payload.path));
              if (!found) return { ok: false, error: "no such file" };
              return { ok: true, entry: found.entry };
            }
            if (command === "oars.sftp.read") {
              const found = fsResolve(pathKey(payload.path));
              if (!found) return { ok: false, error: "no such file" };
              const bytes = found.content;
              const start = Math.min(payload.offset || 0, bytes.length);
              const slice = bytes.subarray(start, start + (payload.max || 65536));
              return { ok: true, base64: b64Bytes(slice), eof: start + slice.length >= bytes.length };
            }
            if (command === "oars.sftp.write") {
              const rec = fsState.uploads.get(payload.transfer_id) || {
                id: payload.transfer_id,
                kind: "upload",
                path: pathKey(payload.path),
                bytes: 0,
                total: payload.total || 0,
                status: "running",
                error: "",
              };
              if (filesMode === "upload-fail" && rec.bytes === 0) {
                return { ok: false, error: "write failed: permission denied" };
              }
              const chunkBytes = atob(payload.base64).length;
              rec.bytes = (payload.offset || 0) + chunkBytes;
              const done = rec.total > 0 ? rec.bytes >= rec.total : true;
              if (done) rec.status = "done";
              fsState.uploads.set(payload.transfer_id, rec);
              return { ok: true, written: rec.bytes, done };
            }
            if (command === "oars.sftp.save") {
              if (filesMode === "conflict" && fsState.conflictArmed && (payload.expected_size !== undefined || payload.expected_sha256 !== undefined)) {
                // The editor's conflict preflight refuses once; a reload
                // (fresh identity) or "keep my version" then succeeds.
                fsState.conflictArmed = false;
                return { ok: false, error: "conflict: the file changed on the server (size); reload and review before saving" };
              }
              fsState.conflictArmed = filesMode === "conflict";
              return { ok: true };
            }
            if (command === "oars.sftp.mkdir") {
              const key = pathKey(payload.path);
              if (FSTREE[key] !== undefined) return { ok: false, error: "already exists" };
              FSTREE[key] = [];
              const parent = key.slice(0, key.lastIndexOf("/")) || "/";
              const name = key.slice(key.lastIndexOf("/") + 1);
              if (FSTREE[parent]) FSTREE[parent].push(entry(name, "dir", 0, now / 1000, {}));
              return { ok: true };
            }
            if (command === "oars.sftp.rename") {
              const from = pathKey(payload.from);
              const to = pathKey(payload.to);
              const parent = to.slice(0, to.lastIndexOf("/")) || "/";
              const name = to.slice(to.lastIndexOf("/") + 1);
              const entries = FSTREE[from.slice(0, from.lastIndexOf("/")) || "/"];
              const idx = entries ? entries.findIndex((e) => e.name.utf8 === from.slice(from.lastIndexOf("/") + 1)) : -1;
              if (idx >= 0) entries[idx] = entry(name, entries[idx].kind, entries[idx].size, entries[idx].mtime, { link_target: entries[idx].link_target });
              if (FSTREE[from] !== undefined) { FSTREE[to] = FSTREE[from]; delete FSTREE[from]; }
              return { ok: true };
            }
            if (command === "oars.sftp.chmod") return { ok: true };
            if (command === "oars.sftp.rm") {
              const key = pathKey(payload.path);
              if (payload.recursive) {
                const id = dlNextId++;
                dlTransfers.set(id, { id, kind: "rm", path: key, bytes: 0, total: 8, status: "running", error: "" });
                return { ok: true, op_id: id };
              }
              const parent = key.slice(0, key.lastIndexOf("/")) || "/";
              const name = key.slice(key.lastIndexOf("/") + 1);
              const list = FSTREE[parent] || [];
              const idx = list.findIndex((e) => e.name.utf8 === name);
              if (idx >= 0) list.splice(idx, 1);
              delete FSTREE[key];
              return { ok: true };
            }
            if (command === "oars.sftp.unzip") {
              const id = dlNextId++;
              dlTransfers.set(id, { id, kind: "unzip", path: pathKey(payload.zip_path), bytes: 0, total: 2048, status: "running", error: "" });
              return { ok: true, op_id: id };
            }
            if (command === "oars.sftp.zipDownload") {
              const id = dlNextId++;
              dlTransfers.set(id, { id, kind: "zip_download", path: payload.paths.map(pathKey).join(", "), bytes: 0, total: 65536, status: "running", error: "" });
              return { ok: true, op_id: id };
            }
            if (command === "oars.sftp.folderSize") {
              return { ok: true, size: 1234567 };
            }
            if (command === "oars.sftp.poll") {
              for (const t of dlTransfers.values()) {
                if (t.status !== "running") continue;
                if ((filesMode === "dlfail" || logsMode === "dlfail") && t.kind === "download") { t.status = "failed"; t.error = "permission denied"; continue; }
                t.bytes = Math.min(t.total, t.bytes + 110000);
                if (t.bytes >= t.total) t.status = "done";
              }
              for (const t of fsState.uploads.values()) {
                if (t.status !== "running") continue;
                t.bytes = Math.min(t.total, t.bytes + 240000);
                if (t.bytes >= t.total) t.status = "done";
              }
              return { ok: true, transfers: [...dlTransfers.values(), ...fsState.uploads.values()] };
            }
            if (command === "oars.sftp.cancel") {
              const t = dlTransfers.get(payload.transfer_id) || fsState.uploads.get(payload.transfer_id);
              if (t && t.status === "running") t.status = "canceled";
              return { ok: true };
            }
            // ── VNC fixtures (spec 12) ────────────────────────────────
            if (command === "oars.vnc.probe") {
              if (vncProbeMode === "error") return { ok: false, error: "probe failed" };
              return vncProbePayload();
            }
            if (command === "oars.vnc.setup") {
              if (!payload.dry_run && vncSetupDelay) await delay(vncSetupDelay);
              const result = vncSetupPayload(payload.display ?? 0, !!payload.dry_run, payload.password, !!payload.install_desktop);
              if (result.ok === false) return result;
              return result;
            }
            if (command === "oars.vnc.start") {
              if (vncTunnelMode === "fail") return { ok: false, error: "tunnel start failed" };
              if (vncTunnelMode === "timeout") { await delay(2500); return { ok: false, error: "tunnel start timed out" }; }
              if (vncTunnelMode === "slow") { await delay(30000); return { ok: false, error: "tunnel start timed out" }; }
              const tid = vncNextTunnelId++;
              const port = vncNextPort++;
              const token = Array.from({length:32}, () => Math.floor(Math.random()*16).toString(16)).join("");
              vncTunnels.set(tid, { port, token, state: vncPollMode, bytes_up: 0, bytes_down: 0, error: vncTunnelMode === "closed" ? "no VNC server on 127.0.0.1:" + (payload.port ?? 5900) + " — try the setup helper" : "" });
              // simulate byte growth on subsequent polls
              return { ok: true, tunnel_id: tid, ws_port: port, token };
            }
            if (command === "oars.vnc.poll") {
              const entry = vncTunnels.get(payload.tunnel_id);
              if (!entry) return { ok: false, error: "unknown tunnel" };
              // advance bytes on each poll call to exercise the footer counter
              entry.bytes_up += 2048;
              entry.bytes_down += entry.state === "connected" ? 8192 : 0;
              // honor ?vncPoll=connected / listening / closed / error
              if (vncPollMode === "closed") entry.state = "closed";
              if (vncPollMode === "error") { entry.state = "closed"; entry.error = "channel open failed"; }
              return { ok: true, state: entry.state, bytes_up: entry.bytes_up, bytes_down: entry.bytes_down, error: entry.error };
            }
            if (command === "oars.vnc.stop") {
              const entry = vncTunnels.get(payload.tunnel_id);
              if (entry) entry.state = "closed";
              return { ok: true };
            }
            if (command === "native-sdk.dialog.saveFile") {
              if (logsMode === "nodialog") return null;
              return "/Users/preview/Downloads/" + (payload.defaultName || "download.log");
            }
            if (command === "native-sdk.dialog.openFile" && payload.allowDirectories) {
              return [payload.defaultPath && LOCAL_TREE[payload.defaultPath] ? payload.defaultPath : LOCAL_ROOT];
            }
            if (command === "oars.ssh.closeChannel") {
              if (payload.channel === followState.channel) followState.closed = true;
              return { ok: true };
            }
            return { ok: true };
          },
        };
        // Wrap ssh.poll to stream diag + follow channel output
        (() => {
          const origInvoke = window.zero.invoke.bind(window.zero);
          window.zero.invoke = async (command, payload={}) => {
            if (command === "oars.ssh.poll") {
              const cur = payload.cursors && payload.cursors[0];
              const chId = cur ? cur.channel : null;
              // Follow channel (spec 04): absolute cursor protocol — the
              // response carries the delta from the requested cursor.
              if (chId === followState.channel && !followState.closed) {
                recordCall(command, payload);
                if (logsMode === "follow-error") {
                  return { ok: false, error: "simulated follow poll failure" };
                }
                followState.polls += 1;
                const p = followState.polls;
                if (p === 3) {
                  followState.emitted += "2026-08-07T10:01:00Z INFO follow chunk A\n2026-08-07T10:01:01Z INFO request 101 handled in 12ms\n2026-08-07T10:01:02Z INFO follow chunk A end\n";
                }
                if (p === 5) {
                  followState.emitted += "tail: '/var/log/nginx/access.log' has been replaced; following new file\n2026-08-07T10:01:30Z INFO rotation chunk B line 1\n2026-08-07T10:01:31Z INFO rotation chunk B line 2\n";
                }
                if (p === 8) {
                  followState.emitted += "2026-08-07T10:02:00Z ERROR checkout-error on order 777\n2026-08-07T10:02:01Z INFO retry in 1s\n";
                }
                const eof = p >= followState.eofAt;
                const from = cur ? cur.cursor : 0;
                const cursor = utf8Length(followState.emitted);
                return {
                  ok: true,
                  status: "ready",
                  channels: [{
                    id: followState.channel,
                    kind: "log",
                    command: "tail -n 100 -F /var/log/nginx/access.log",
                    cursor,
                    dropped: p === followState.droppedAt ? 4096 : 0,
                    pending: 0,
                    eof,
                    exit: null,
                    data: utf8Slice(followState.emitted, from),
                  }],
                };
              }
              if (chId !== null && window.__oarsMock.diagChannels && window.__oarsMock.diagChannels.has(chId)) {
                const entry = window.__oarsMock.diagChannels.get(chId);
                if (!entry.done) {
                  entry.done = true;
                  return { ok: true, status: "ready", channels: [{ id: chId, kind: "exec", command: "diag", cursor: entry.label.length, dropped: 0, pending: 0, eof: true, exit: 0, data: entry.label }] };
                }
                return { ok: true, status: "ready", channels: [{ id: chId, kind: "exec", command: "diag", cursor: entry.label.length, dropped: 0, pending: 0, eof: true, exit: 0, data: "" }] };
              }
            }
            return origInvoke(command, payload);
          };
        })();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
